name: 주가 갱신

on:
  schedule:
    # 평일 장중 10분마다 (UTC 00:00~06:59 = 한국 09:00~15:59)
    - cron: "*/10 0-6 * * 1-5"
    # 장 마감 뒤 종가 확정 (한국 16:10)
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이전 시세 받기
        run: curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/prices/market.json" -o old.json || echo '{}' > old.json
      - name: 네이버 시세 가져오기
        run: python3 scripts/prices.py old.json market.json
      - name: prices 브랜치에 올리기
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp market.json out/ && cd out
          git init -q -b prices
          git add market.json
          git -c user.name="price-bot" -c user.email="price-bot@users.noreply.github.com" commit -qm "주가 갱신"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prices
